<style>
:root{--d:#0A4350;--t:#0B6B7A;--g:#E0A52B;--bg:#EAF8F5;--l:#D5EEEA}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--d);font:500 16px/1.45 'Baloo 2',system-ui,sans-serif}
header{background:var(--d);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
header img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px}
header b{font-size:1.2rem;margin-right:auto}
header button{background:transparent;color:#fff;border:2px solid transparent;border-radius:20px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer}
header button.on{background:var(--t)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0;font-size:1.25rem}
.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.st{background:#fff;border-radius:20px;padding:18px;text-align:center}.st h1{margin:0;font-size:2.2rem}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--l)}
.a{display:flex;gap:8px;flex:none}
button,input,select,textarea{font:inherit}
.a button,.b{border:2px solid var(--t);background:#fff;color:var(--d);border-radius:14px;padding:6px 14px;cursor:pointer;font-weight:700}
.b{background:var(--t);color:#fff}.b.o{background:#fff;color:var(--d)}.b.big{width:100%;min-height:48px;margin-top:10px}
.a .x{border-color:#B3261E;color:#B3261E}

<script type="text/plain" id="sql-src">
-- Run once in Supabase > SQL Editor.
create table profiles(id uuid primary key references auth.users on delete cascade,role text default 'parent',full_name text,phone text,pin_hash text,consent_at timestamptz,created_at timestamptz default now());
create table children(id uuid primary key default gen_random_uuid(),parent_id uuid not null references profiles on delete cascade,name text not null,color text default '#0B6B7A',class int not null check(class between 1 and 3),limit_min int default 30);
create table subjects(id uuid primary key default gen_random_uuid(),class int not null,name text not null,letter text,color text default '#0B6B7A',sort int default 0);
create table chapters(id uuid primary key default gen_random_uuid(),subject_id uuid references subjects on delete cascade,title text not null,sort int default 0);
create table lessons(id uuid primary key default gen_random_uuid(),chapter_id uuid references chapters on delete cascade,title text not null,kind text default 'video',bunny_video_id text,body text,is_free bool default false,sort int default 0);
create table questions(id uuid primary key default gen_random_uuid(),chapter_id uuid references chapters on delete cascade,q text not null,options jsonb not null,answer int not null,explain text);
create table progress(child_id uuid references children on delete cascade,lesson_id uuid references lessons on delete cascade,updated_at timestamptz default now(),primary key(child_id,lesson_id));
create table attempts(id uuid primary key default gen_random_uuid(),child_id uuid references children on delete cascade,chapter_id uuid references chapters on delete cascade,score int,total int,created_at timestamptz default now());
create table study_log(child_id uuid references children on delete cascade,day date,seconds int default 0,primary key(child_id,day));
create table subscriptions(parent_id uuid primary key references profiles on delete cascade,status text default 'none',razorpay_sub_id text,trial_ends_at timestamptz,current_end timestamptz,updated_at timestamptz default now());
create table payments(id uuid primary key default gen_random_uuid(),parent_id uuid references profiles on delete cascade,amount int,status text,razorpay_payment_id text,created_at timestamptz default now());
create table feedback(id uuid primary key default gen_random_uuid(),parent_id uuid references profiles on delete set null,rating int,message text,created_at timestamptz default now());

create function is_admin() returns bool language sql stable security definer set search_path=public as $$ select exists(select 1 from profiles where id=auth.uid() and role='admin') $$;
create function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$ begin insert into profiles(id,full_name,phone,consent_at) values(new.id,new.raw_user_meta_data->>'full_name',new.raw_user_meta_data->>'phone',case when new.raw_user_meta_data->>'consent'='true' then now() end); return new; end $$;
create trigger on_signup after insert on auth.users for each row execute function handle_new_user();
create function add_study(c uuid,s int,d date) returns void language sql security definer set search_path=public as $$ insert into study_log(child_id,day,seconds) select c,d,s where exists(select 1 from children where id=c and parent_id=auth.uid()) on conflict(child_id,day) do update set seconds=study_log.seconds+s $$;
create function delete_my_account() returns void language sql security definer set search_path=public as $$ delete from auth.users where id=auth.uid() $$;

do $$ declare t text; begin
 foreach t in array array['profiles','children','subjects','chapters','lessons','questions','progress','attempts','study_log','subscriptions','payments','feedback'] loop execute format('alter table %I enable row level security',t); end loop;
 foreach t in array array['subjects','chapters','lessons','questions'] loop
  execute format('create policy "read" on %I for select to authenticated using(true)',t);
  execute format('create policy "admin" on %I for all to authenticated using(is_admin()) with check(is_admin())',t); end loop;
 foreach t in array array['progress','attempts','study_log'] loop
  execute format('create policy "own" on %I for all to authenticated using(exists(select 1 from children c where c.id=child_id and c.parent_id=auth.uid())) with check(exists(select 1 from children c where c.id=child_id and c.parent_id=auth.uid()))',t); end loop;
 foreach t in array array['subscriptions','payments'] loop
  execute format('create policy "own" on %I for select to authenticated using(parent_id=auth.uid() or is_admin())',t); end loop;
end $$;
create policy "own" on profiles for select to authenticated using(id=auth.uid() or is_admin());
create policy "upd" on profiles for update to authenticated using(id=auth.uid());
revoke update on profiles from authenticated;
grant update(full_name,phone,pin_hash) on profiles to authenticated;
create policy "own" on children for all to authenticated using(parent_id=auth.uid() or is_admin()) with check(parent_id=auth.uid());
create policy "ins" on feedback for insert to authenticated with check(parent_id=auth.uid());
create policy "adm" on feedback for select to authenticated using(is_admin());

alter table profiles add column email_optout bool default false;
grant update(email_optout) on profiles to authenticated;
create table email_campaigns(id uuid primary key default gen_random_uuid(),subject text,audience text,sent int,created_by uuid,created_at timestamptz default now());
alter table email_campaigns enable row level security;
create policy "adm" on email_campaigns for select to authenticated using(is_admin());
</script>
<script type="text/plain" id="fn-src">
// Supabase Edge Function: send-bulk-email
// Deploy as supabase/functions/send-bulk-email/index.ts
// Secrets needed: RESEND_API_KEY, MAIL_FROM (e.g. "DeepEx <hello@yourdomain.com>", domain verified in Resend)
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const cors={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'authorization, x-client-info, apikey, content-type'};
const J=(o:unknown,s=200)=>new Response(JSON.stringify(o),{status:s,headers:{...cors,'Content-Type':'application/json'}});
const esc=(s:string)=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]!));
const wait=(ms:number)=>new Promise(r=>setTimeout(r,ms));

Deno.serve(async req=>{
 if(req.method==='OPTIONS')return new Response('ok',{headers:cors});
 const svc=createClient(Deno.env.get('SUPABASE_URL')!,Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!);
 const{data:{user}}=await svc.auth.getUser((req.headers.get('Authorization')||'').replace('Bearer ',''));
 if(!user)return J({error:'लॉगिन ज़रूरी है'},401);
 const{data:me}=await svc.from('profiles').select('role').eq('id',user.id).single();
 if(me?.role!=='admin')return J({error:'अनुमति नहीं है'},403);

 const{aud,subject,body,dry_run}=await req.json();
 if(!['all','trial','active','expired'].includes(aud))return J({error:'समूह सही नहीं है'});
 if(!subject?.trim()||!body?.trim())return J({error:'विषय और संदेश भरें'});

 // who gets it: parents who have not opted out, filtered by plan status
 const{data:ps}=await svc.from('profiles').select('id,full_name,email_optout,subscriptions(status,trial_ends_at,current_end)').eq('role','parent');
 const now=Date.now();
 const st=(p:any)=>{const x=([] as any[]).concat(p.subscriptions||[])[0];if(!x)return'expired';const end=Math.max(+new Date(x.trial_ends_at||0),+new Date(x.current_end||0));return end>now?(x.status==='trialing'?'trial':'active'):'expired'};
 const ok=new Map((ps||[]).filter((p:any)=>!p.email_optout&&(aud==='all'||st(p)===aud)).map((p:any)=>[p.id,p.full_name||'']));

 const to:{email:string,name:string}[]=[];
 for(let page=1;;page++){
  const{data,error}=await svc.auth.admin.listUsers({page,perPage:1000});
  if(error)return J({error:'यूज़र की लिस्ट नहीं मिली'});
  for(const u of data.users)if(u.email&&u.email_confirmed_at&&ok.has(u.id))to.push({email:u.email,name:ok.get(u.id)!});
  if(data.users.length<1000)break;
 }
 if(dry_run)return J({count:to.length});

 const key=Deno.env.get('RESEND_API_KEY'),from=Deno.env.get('MAIL_FROM');
 if(!key||!from)return J({error:'ईमेल सेटअप पूरा नहीं है (RESEND_API_KEY, MAIL_FROM)'});
 const html=(n:string)=>`<div style="font-family:sans-serif;font-size:16px;line-height:1.6">${n?`<p>नमस्ते ${esc(n)},</p>`:''}${esc(body).replace(/\n/g,'<br>')}<hr><p style="font-size:13px;color:#666">प्रचार ईमेल बंद करने के लिए ऐप में पेरेंट ज़ोन > ऐप सेटिंग खोलें।</p></div>`;

 let sent=0;
 for(let i=0;i<to.length;i+=100){
  const chunk=to.slice(i,i+100).map(t=>({from,to:[t.email],subject:subject.trim(),html:html(t.name)}));
  const r=await fetch('https://api.resend.com/emails/batch',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify(chunk)});
  if(r.ok)sent+=chunk.length;
  await wait(600);
 }
 await svc.from('email_campaigns').insert({subject:subject.trim(),audience:aud,sent,created_by:user.id});
 return J({sent,failed:to.length-sent});
});
</script>

function login(msg){
 A.innerHTML=`<div class="card lg"><h2>एडमिन लॉगिन</h2>${msg?`<p style="color:#B3261E">${msg}</p>`:''}<form id="lf"><label>ईमेल<input name="email" type="email" required autocomplete="email"></label><label>पासवर्ड<input name="pw" type="password" required autocomplete="current-password"></label><button class="b big">लॉगिन</button></form><button class="b o big" onclick="setup()">पहली बार? सेटअप गाइड</button></div>`;
 form('#lf',async d=>{const{error}=await sb.auth.signInWithPassword({email:d.email,password:d.pw});if(error)throw Error('ईमेल या पासवर्ड ग़लत है');init()});
}
async function out(){await sb.auth.signOut();location.reload()}
function show(t){tab=t;document.querySelectorAll('header button[id]').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));({dash,content,users,mail,setup,fbk}[t])()}

/* ---------- dashboard ---------- */
const cnt=(t,f)=>{const q=sb.from(t).select('*',{count:'exact',head:true});return(f?f(q):q).then(r=>r.count??0)};
async function dash(){
 const[u,k,s,l,q,f]=await Promise.all([cnt('profiles',q=>q.eq('role','parent')),cnt('children'),cnt('subscriptions',q=>q.in('status',['trialing','active'])),cnt('lessons'),cnt('questions'),cnt('feedback')]);
 $('#v').innerHTML=`<div class="g4">${[['माता-पिता',u],['बच्चे',k],['ट्रायल/चालू प्लान',s],['पाठ',l],['क्विज़ के सवाल',q],['फीडबैक',f]].map(([n,v])=>`<div class="st"><h1>${v}</h1><p>${n}</p></div>`).join('')}</div>`;
}

/* ---------- content ---------- */
const list=(t,items,tt,sub,open)=>{DATA[t]=items;return`<div class="card"><div class="hd"><h2>${LBL[t]}</h2><button class="b" onclick="edit('${t}')">+ जोड़ें</button></div>${items.map(r=>`<div class="r"><div><b>${E(tt(r))}</b><br><small>${sub(r)}</small></div><div class="a">${open?`<button onclick="${open(r)}">खोलें</button>`:''}<button onclick="edit('${t}','${r.id}')">बदलें</button><button class="x" onclick="del('${t}','${r.id}')">हटाएँ</button></div></div>`).join('')||'<p class="m">अभी कुछ नहीं जोड़ा गया।</p>'}</div>`};
async function content(){
 const R=async(t,c,v,o)=>(await sb.from(t).select('*').eq(c,v).order(o||'sort')).data||[];
 let h=`<div class="pills">${[1,2,3].map(n=>`<button class="${C.cls===n?'on':''}" onclick="C={cls:${n},s:null,c:null};content()">कक्षा ${n}</button>`).join('')}</div>`;
 const S=await R('subjects','class',C.cls),sj=S.find(x=>x.id===C.s);
 if(!sj){C.s=C.c=null;h+=list('subjects',S,r=>r.name,r=>`क्रम ${r.sort}`,r=>`C.s='${r.id}';content()`)}
 else{
  const H=await R('chapters','subject_id',sj.id),ch=H.find(x=>x.id===C.c);
  h+=`<p class="bc"><a onclick="C.s=C.c=null;content()">सभी विषय</a> / <a onclick="C.c=null;content()">${E(sj.name)}</a>${ch?' / '+E(ch.title):''}</p>`;
  if(!ch){C.c=null;h+=list('chapters',H,r=>r.title,r=>`क्रम ${r.sort}`,r=>`C.c='${r.id}';content()`)}
  else{
   const[L,Z]=await Promise.all([R('lessons','chapter_id',ch.id),R('questions','chapter_id',ch.id,'q')]);
   h+=list('lessons',L,r=>r.title,r=>`${KIND[r.kind]||''} | ${r.is_free?'फ्री':'पेड'}`)+list('questions',Z,r=>r.q,r=>`${r.options.length} विकल्प`);
  }
 }
 $('#v').innerHTML=h;
}
const fld=(f,r)=>{
 const v=r[f.k],rq=f.req===0?'':'required',l=`<label>${f.l}`;
 if(f.t==='sel')return`${l}<select name="${f.k}">${f.o.map(o=>`<option value="${o}" ${(f.k==='answer'?r.answer+1:v)==o?'selected':''}>${f.k==='answer'?'विकल्प '+o:o}</option>`).join('')}</select></label>`;
 if(f.t==='area')return`${l}<textarea name="${f.k}" rows="3" ${rq}>${E(v)}</textarea></label>`;
 if(f.t==='chk')return`<label class="ck"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${f.l}</label>`;
 if(f.t==='color')return`${l}<input type="color" name="${f.k}" value="${v||'#0B6B7A'}"></label>`;
 if(f.t==='opts')return[0,1,2,3].map(i=>`<label>${f.l} ${i+1}<input name="o${i}" ${i<2?'required':''} value="${E(r.options?.[i])}"></label>`).join('');
 return`${l}<input name="${f.k}" ${f.t==='num'?`type="number" value="${v??0}"`:`value="${E(v)}" ${rq}`}></label>`;
};
function edit(t,id){
 const r=DATA[t]?.find(x=>x.id===id)||(t==='subjects'?{class:C.cls}:{});
 modal(`<form id="ef"><h2>${id?'बदलें':'नया जोड़ें'}: ${LBL[t]}</h2>${F[t].map(f=>fld(f,r)).join('')}<button class="b big">सेव करें</button><button type="button" class="b o big" onclick="closeM()">रद्द करें</button></form>`);
 form('#ef',async d=>{
  const o={};
  F[t].forEach(f=>{let v=d[f.k];
   if(f.t==='num')v=+v||0;else if(f.t==='sel'&&typeof f.o[0]==='number')v=+v;else if(f.t==='chk')v=d[f.k]==='on';
   else if(f.t==='opts')v=[0,1,2,3].map(i=>(d['o'+i]||'').trim()).filter(Boolean);
   else v=(v||'').trim()||null;
   o[f.k]=v});
  if(t==='questions'){o.answer-=1;if(o.answer>=o.options.length)throw Error('सही विकल्प भरे हुए विकल्पों में से चुनें')}
  if(t==='lessons'){if(o.kind==='video'&&!o.bunny_video_id)throw Error('वीडियो पाठ के लिए bunny.net वीडियो ID डालें');if(o.kind!=='video'&&!o.body)throw Error('कहानी/कविता का टेक्स्ट डालें')}
  if(PARENT[t])o[PARENT[t][0]]=C[PARENT[t][1]];
  const{error}=await(id?sb.from(t).update(o).eq('id',id):sb.from(t).insert(o));
  if(error)throw error;closeM();toast('सेव हो गया');content();
 });
}
async function del(t,id){
 if(!confirm('हटाने पर इसके अंदर का सारा कंटेंट भी हट जाएगा। पक्का?'))return;
 const{error}=await sb.from(t).delete().eq('id',id);if(error)return toast('हटाया नहीं जा सका');toast('हट गया');content();
}

/* ---------- users ---------- */
async function users(){
 const{data,error}=await sb.from('profiles').select('*,children(name,class),subscriptions(status,trial_ends_at,current_end)').eq('role','parent').order('created_at',{ascending:false});
 if(error)return toast('यूज़र की लिस्ट नहीं मिली');
 UL=data||[];$('#v').innerHTML='<input id="q" placeholder="नाम या मोबाइल से खोजें" oninput="ulist()" aria-label="खोजें"><div id="ul"></div>';ulist();
}
function ulist(){
 const s=$('#q').value.toLowerCase().trim();
 const plan=u=>{const x=[].concat(u.subscriptions||[])[0];if(!x)return'कोई प्लान नहीं';const end=Math.max(+new Date(x.trial_ends_at||0),+new Date(x.current_end||0));return end>Date.now()?(x.status==='trialing'?'ट्रायल':'चालू'):'ख़त्म'};
 const rows=UL.filter(u=>`${u.full_name||''} ${u.phone||''}`.toLowerCase().includes(s));
 $('#ul').innerHTML=`<div class="card" style="overflow:auto"><p class="m">${rows.length} यूज़र</p><table><tr><th>नाम</th><th>मोबाइल</th><th>बच्चे</th><th>प्लान</th><th>जुड़े</th></tr>${rows.map(u=>`<tr><td>${E(u.full_name)}</td><td>${E(u.phone)}</td><td>${(u.children||[]).map(c=>E(c.name)+' (क.'+c.class+')').join(', ')||'-'}</td><td>${plan(u)}</td><td>${new Date(u.created_at).toLocaleDateString('hi-IN')}</td></tr>`).join('')}</table></div>`;
}

/* ---------- setup guide (all code lives in this file) ---------- */
function setup(){
 const sql=$('#sql-src').textContent.trim(),fn=$('#fn-src').textContent.trim();
 const h=`<div class="card"><h2>सेटअप गाइड (सिर्फ़ एक बार)</h2><p class="m">सारा कोड इसी फ़ाइल में है। अलग फ़ाइल की ज़रूरत नहीं।</p></div>
 <div class="card"><h2>1. डेटाबेस बनाएँ</h2><p>Supabase में SQL Editor खोलिए, यह कोड पेस्ट करके Run दबाइए।</p><button class="b" onclick="copyTxt('sql-src')">SQL कॉपी करें</button><pre>${E(sql)}</pre></div>
 <div class="card"><h2>2. खुद को एडमिन बनाएँ</h2><p>पहले User.html में अपना अकाउंट बनाइए। फिर वही ईमेल यहाँ डालिए और नीचे का कोड SQL Editor में चलाइए।</p><input id="ae" type="email" placeholder="आपका ईमेल" oninput="adm()" aria-label="आपका ईमेल"><pre id="ao"></pre><button class="b" onclick="copyTxt('ao')">कोड कॉपी करें</button></div>
 <div class="card"><h2>3. ईमेल भेजने वाला फ़ंक्शन</h2><p>Supabase में Edge Functions खोलिए, नया फ़ंक्शन बनाइए (नाम: send-bulk-email), यह कोड पेस्ट करके Deploy कीजिए। फिर Secrets में RESEND_API_KEY और MAIL_FROM डालिए। यह कोड सर्वर पर ही चल सकता है, इसलिए इसे Supabase में रखना ज़रूरी है।</p><button class="b" onclick="copyTxt('fn-src')">कोड कॉपी करें</button><pre>${E(fn)}</pre></div>`;
 if($('#v'))$('#v').innerHTML=h;else A.innerHTML='<main>'+h+'<button class="b o big" onclick="init()">वापस लॉगिन पर</button></main>';
 adm();scrollTo(0,0);
}
const adm=()=>{const e=($('#ae')?.value||'').trim().replace(/'/g,"''")||'आपका@ईमेल';$('#ao').textContent=`update profiles set role='admin' where id=(select id from auth.users where email='${e}');`};
const copyTxt=id=>navigator.clipboard.writeText($('#'+id).textContent.trim()).then(()=>toast('कॉपी हो गया'),()=>toast('कॉपी नहीं हो सका, कोड चुनकर कॉपी करें'));

/* ---------- bulk email ---------- */
async function mail(){
 const{data}=await sb.from('email_campaigns').select('*').order('created_at',{ascending:false}).limit(10);
 const AUD={all:'सभी माता-पिता',trial:'ट्रायल वाले',active:'चालू प्लान वाले',expired:'प्लान ख़त्म / कोई प्लान नहीं'};
 $('#v').innerHTML=`<div class="card"><h2>सब यूज़र को एक साथ ईमेल</h2><form id="mf"><label>किसको भेजें<select name="aud">${Object.entries(AUD).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label><label>विषय<input name="subject" required maxlength="150"></label><label>संदेश<textarea name="body" rows="8" required></textarea></label><button class="b big">आगे बढ़ें</button></form><p class="m">ईमेल सिर्फ़ उन्हें जाता है जिन्होंने प्रचार ईमेल बंद नहीं किए हैं। हर ईमेल अलग से जाता है, कोई किसी का पता नहीं देखता।</p></div><div class="card"><h2>पिछले ईमेल</h2>${(data||[]).map(x=>`<div class="r"><div><b>${E(x.subject)}</b><br><small>${E(AUD[x.audience]||x.audience)} | ${x.sent} भेजे गए</small></div><small>${new Date(x.created_at).toLocaleString('hi-IN')}</small></div>`).join('')||'<p class="m">अभी कुछ नहीं भेजा।</p>'}</div>`;
 form('#mf',async d=>{
  const c=await sb.functions.invoke('send-bulk-email',{body:{...d,dry_run:true}});
  if(c.error||c.data?.error)throw Error(c.data?.error||'गिनती नहीं मिली, सर्वर फ़ंक्शन जाँचें');
  if(!c.data.count)throw Error('इस समूह में कोई यूज़र नहीं है');
  if(!confirm(`यह ईमेल ${c.data.count} लोगों को जाएगा। भेजें?`))return;
  const s=await sb.functions.invoke('send-bulk-email',{body:d});
  if(s.error||s.data?.error)throw Error(s.data?.error||'ईमेल नहीं भेजा जा सका');
  toast(`${s.data.sent} ईमेल भेजे गए`+(s.data.failed?`, ${s.data.failed} नहीं गए`:''));mail();
 });
}

/* ---------- feedback ---------- */
async function fbk(){
 const{data,error}=await sb.from('feedback').select('*').order('created_at',{ascending:false}).limit(200);
 if(error)return toast('फीडबैक नहीं मिला');
 const L=data||[],avg=L.length?(L.reduce((n,x)=>n+x.rating,0)/L.length).toFixed(1):'-';
 $('#v').innerHTML=`<div class="card"><h2>औसत रेटिंग: ${avg} / 5 (${L.length} फीडबैक)</h2>${L.map(x=>`<div class="r"><div><b>${'★'.repeat(x.rating)}</b> ${E(x.message)}</div><small>${new Date(x.created_at).toLocaleDateString('hi-IN')}</small></div>`).join('')||'<p class="m">अभी कोई फीडबैक नहीं आया।</p>'}</div>`;
}
init();
</script>

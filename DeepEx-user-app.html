<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--d:#0A4350;--t:#0B6B7A;--g:#E0A52B;--bg:#EAF8F5;--c:#fff;--x:#0A4350;--l:#D5EEEA;--nb:#F0F9F7;--ni:#BFE6E0}
[data-th=dark]{--bg:#0A2A31;--c:#123C46;--x:#E6F7F4;--l:#1E5360;--nb:#0E343D;--ni:#2A6B78}
*{box-sizing:border-box}[hidden]{display:none!important}html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--x);font:500 1rem/1.4 'Baloo 2',system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:1.7rem;margin:0;line-height:1.2}h2{font-size:1.25rem;margin:20px 0 8px}p{margin:0}
.card{background:var(--c);border-radius:24px;padding:16px;margin:12px 0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
button,input,select,textarea{font:inherit}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:28px;background:var(--t);color:#fff;font-weight:700;font-size:1.1rem;text-align:center;padding:12px 20px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.g{background:var(--g);color:#0A4350}
.sp:has(.prem){flex-wrap:wrap}
.sp:has(.prem)>b{flex:1 1 100%}
.prem{position:relative;overflow:hidden;flex:1 1 100%;width:100%;margin-top:6px;border:1.5px solid #FFE9A8;border-radius:20px;padding:14px 18px 15px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;color:#3B2600;font-family:inherit;background:linear-gradient(135deg,#FFE27A 0%,#E9AE2E 45%,#B97C12 100%);box-shadow:0 8px 22px rgba(224,165,43,.38),0 0 0 3px rgba(224,165,43,.14),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(120,70,0,.25);transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.prem:active{transform:scale(.97);box-shadow:0 3px 10px rgba(224,165,43,.35),inset 0 2px 4px rgba(120,70,0,.3)}
.prem::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:premShine 3.2s ease-in-out infinite}
@keyframes premShine{0%,55%{left:-60%}100%{left:130%}}
.pm-badge{font-size:.68rem;font-weight:800;letter-spacing:.14em;background:#3B2600;color:#FFE27A;padding:3px 10px;border-radius:999px;margin-bottom:4px}
.pm-main{font-size:1.15rem;font-weight:800;line-height:1.25;text-shadow:0 1px 0 rgba(255,255,255,.45)}
.pm-sub{font-size:.8rem;font-weight:600;opacity:.8;line-height:1.3}
@media (prefers-reduced-motion:reduce){.prem::after{animation:none}}
.btn.o{background:var(--c);color:var(--x);border:2px solid var(--t)}.btn.r{background:#B3261E}
input,select,textarea{width:100%;min-height:52px;border:2px solid var(--l);border-radius:16px;padding:8px 14px;background:var(--c);color:var(--x);margin:6px 0}
label{font-weight:700;display:block;margin-top:8px}
:focus-visible{outline:4px solid var(--g);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}

const KIND_EN={'वीडियो':'Video','कहानी':'Story','कविता':'Poem'};
const KRX=new RegExp(NF('^(वीडियो|कहानी|कविता)( \\| लॉक)?$')),LRX=new RegExp(NF('^\\| लॉक$'));
function tr(s,el){
 if(LANG!=='en'||typeof s!=='string')return s;
 const t=s.trim();if(!t)return s;
 const n=NF(t);let r=EN.get(n);
 if(r===undefined)for(const[x,v]of RX){if(x.test(n)){r=n.replace(x,v);break}}
 if(r===undefined){const m=n.match(/^([\s\S]*?)( \([\s\S]*\))$/);if(m&&EN.has(m[1]))r=EN.get(m[1])+m[2]}
 if(r===undefined&&el&&el.tagName==='SMALL'){
  const k=n.match(KRX);if(k)r=KIND_EN[k[1]]+(k[2]?' | Locked':'');
  else if(LRX.test(n))r='| Locked';
 }
 return r===undefined?s:s.replace(t,()=>r);
}

const TV=new WeakMap(),OA=new WeakMap(),AT=['placeholder','aria-label','title'];
function trAttr(el,a){
 const cur=el.getAttribute(a);if(cur==null)return;
 let m=OA.get(el);const rec=m&&m[a];
 if(rec&&cur===rec.t)return;
 const v=tr(cur);
 if(v!==cur){if(!m){m={};OA.set(el,m)}m[a]={o:cur,t:v};el.setAttribute(a,v)}
}
function trText(n){
 const p=n.parentElement;if(!p||p.closest('.opt,.story,script,style'))return;
 const cur=n.nodeValue,rec=TV.get(n);
 if(rec&&cur===rec.t)return;
 const v=tr(cur,p);
 if(v!==cur){TV.set(n,{o:cur,t:v});n.nodeValue=v}
}
function walk(root){
 if(root.nodeType===3)return trText(root);
 if(root.nodeType!==1)return;
 const w=document.createTreeWalker(root,5);let n=root;
 do{if(n.nodeType===1){for(const a of AT)if(n.hasAttribute(a))trAttr(n,a)}else trText(n)}while(n=w.nextNode());
}
function restore(root){
 const w=document.createTreeWalker(root,5);let n=root;
 do{if(n.nodeType===1){const m=OA.get(n);if(m){for(const a in m)if(n.getAttribute(a)===m[a].t)n.setAttribute(a,m[a].o);OA.delete(n)}}
 else{const r=TV.get(n);if(r&&n.nodeValue===r.t)n.nodeValue=r.o;TV.delete(n)}}while(n=w.nextNode());
}
const MO=new MutationObserver(ms=>{for(const m of ms){
 if(m.type==='childList')m.addedNodes.forEach(walk);
 else if(m.type==='characterData')trText(m.target);
 else if(m.type==='attributes')trAttr(m.target,m.attributeName);
}});
function applyLang(){
 document.documentElement.lang=LANG;
 MO.disconnect();restore(document.body);
 if(LANG==='en'){walk(document.body);MO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:AT})}
}

async function quiz(cid){
 const{data}=await sb.from('questions').select('*').eq('chapter_id',cid);
 if(!data?.length)return shell(`<div class="hd">${back}</div>${empty('इस चैप्टर के सवाल जल्द आएँगे।')}`,'home');
 Q={cid,qs:data.sort(()=>Math.random()-.5),i:0,ok:0,bad:[],lock:0,retry:0};qshow();
}
function qshow(){
 const q=Q.qs[Q.i];
 shell(`<div class="hd">${back}<b>${Q.i+1}/${Q.qs.length}</b></div><div class="bar" style="margin-top:12px"><u style="width:${pct(Q.i,Q.qs.length)}%"></u></div><div class="card"><h2 style="margin:0">${E(q.q)}</h2></div>${q.options.map((o,n)=>`<button class="btn opt" onclick="qans(${n})">${E(o)}</button>`).join('')}<div id="fb"></div>`,'home');
}
function qans(n){
 if(Q.lock)return;Q.lock=1;const q=Q.qs[Q.i],r=n===q.answer;r?Q.ok++:Q.bad.push(q);
 document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('ok');else if(i===n)b.classList.add('no')});
 $('#fb').innerHTML=`<div class="card"><b>${r?'शाबाश! सही जवाब':'कोई बात नहीं, फिर कोशिश करेंगे'}</b>${q.explain?`<p>${E(q.explain)}</p>`:''}</div><button class="btn g" onclick="qnext()">${Q.i+1<Q.qs.length?'आगे बढ़ो':'नतीजा देखो'}</button>`;
}
async function qnext(){
 Q.lock=0;if(++Q.i<Q.qs.length)return qshow();
 if(!Q.retry)await sb.from('attempts').insert({child_id:kid.id,chapter_id:Q.cid,score:Q.ok,total:Q.qs.length});
 shell(`<div class="card ctr"><h1>${Q.ok}/${Q.qs.length}</h1><p>सही जवाब</p></div>${Q.bad.length?'<button class="btn" onclick="qretry()">ग़लत सवाल दोबारा</button>':''}<button class="btn g" onclick="history.back()">वापस जाएँ</button>`,'home');
}
function qretry(){Q={...Q,qs:Q.bad,bad:[],i:0,ok:0,retry:1};qshow()}

   return toast('पेमेंट पेज नहीं खुला। इंटरनेट जाँचें।');
  }
  const rz=new Razorpay({key:data.key_id||CFG.RAZORPAY_KEY_ID,subscription_id:data.subscription_id,name:CFG.APP_NAME||'DeepEx',theme:{color:'#0B6B7A'},prefill:{email:U.email,contact:P.phone},
   modal:{ondismiss(){subBusy=false}},
   handler(){toast('पेमेंट सफल! प्लान चालू हो रहा है...');setTimeout(async()=>{await load();route()},3000)}});
  rz.on('payment.failed',e=>toast('पेमेंट फेल: '+(e.error?.description||'दोबारा कोशिश करें')));
  toast('2/3: पेमेंट पॉपअप खोल रहा हूँ...');
  rz.open();
  setTimeout(()=>{if(!document.querySelector('.razorpay-container')){if(data.short_url){location.href=data.short_url}else toast('3/3: पॉपअप नहीं खुला। ब्राउज़र/ऐड-ब्लॉकर जाँचें या दूसरे ब्राउज़र में खोलें।')}},2500);
 }catch(e){
  console.error(e);
  if(data?.short_url){location.href=data.short_url;return}
  toast('गड़बड़: '+(e.message||e));
 }finally{setBusy(false);setTimeout(()=>{subBusy=false},4000)}
}
async function cancelSub(){if(!confirm('सब्सक्रिप्शन रद्द करें?'))return;const{error}=await sb.functions.invoke('cancel-subscription');if(error)return toast('रद्द नहीं हो सका');await load();route();toast('सब्सक्रिप्शन रद्द हो गया')}

/* ---------- daily screen-time limit ---------- */
const limSec=()=>kid.limit_min*60+(localStorage.bd===day()?+localStorage.bonus:0);
function lock(){
 if(!(kid&&kid.limit_min>0&&today>=limSec()))return false;
 plain(`<div class="card ctr" style="margin-top:40px">${logo}<h1>आज की पढ़ाई पूरी!</h1><p>कल फिर मिलेंगे।</p><form id="lf"><p class="mut" style="margin:14px 0 4px">चाहें तो 15 मिनट और बढ़ा सकते हैं।</p><button class="btn g">15 मिनट और दें</button></form></div>`);
 form('#lf',async d=>{localStorage.bonus=(localStorage.bd===day()?+localStorage.bonus:0)+900;localStorage.bd=day();route()});
 return true;
}
setInterval(()=>{if(document.hidden||!kid||!U||!sb)return;today+=30;sb.rpc('add_study',{c:kid.id,s:30,d:day()});if(kid.limit_min>0&&today>=limSec())route()},30000);
applyLang();init();
</script>

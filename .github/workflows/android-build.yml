
name: DeepEx Android Build Preparation

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "Admin_(1).html"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  inspect-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking DeepEx project files"
          test -f index.html
          echo "index.html found"

          if [ -f "Admin_(1).html" ]; then
            echo "Admin page found"
          fi

          echo "Project inspection completed."
